    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Atreya",
        "url": "https://atreya.store/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "https://atreya.store/shop?q={search_term_string}" },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Self-heal: if a build asset fails to load (stale cached page after a
      // redeploy), refresh once to pick up the current HTML and assets.
      (function () {
        addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var last = +sessionStorage.getItem('assetReload') || 0;
          if (Date.now() - last < 10000) return;
          sessionStorage.setItem('assetReload', String(Date.now()));
          location.reload();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
